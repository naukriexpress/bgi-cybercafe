name: Build website ZIP
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Package full website source
        run: |
          mkdir -p dist
          zip -qr dist/bgi-cybercafe-source.zip . -x ".git/*" "dist/*"
      - uses: actions/upload-artifact@v4
        with:
          name: bgi-cybercafe-source
          path: dist/bgi-cybercafe-source.zip
          retention-days: 7
