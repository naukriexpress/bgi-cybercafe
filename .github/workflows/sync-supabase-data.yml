name: Sync Supabase data to static site

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: supabase-static-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refresh static data from Supabase
        run: node scripts/sync-supabase-to-static.mjs
      - name: Commit and push changed snapshots
        run: |
          if git diff --quiet -- js/site-data.js js/service-data.js data/master-documents.json; then
            echo "Supabase data has not changed; no commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/site-data.js js/service-data.js data/master-documents.json
          git commit -m "chore: sync static data from Supabase"
          git push origin HEAD:main
