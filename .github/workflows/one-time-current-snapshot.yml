name: One-time current database snapshot refresh

on:
  push:
    branches: [main]
    paths:
      - ".snapshot-sync-trigger"

permissions:
  contents: write

concurrency:
  group: one-time-current-site-snapshot
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refresh GitHub snapshots from current Supabase data
        run: node scripts/sync-supabase-to-static.mjs
      - name: Commit and push changed snapshots only
        run: |
          if git diff --quiet -- js/site-data.js js/service-data.js data/master-documents.json; then
            echo "The GitHub snapshots already match the current database."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/site-data.js js/service-data.js data/master-documents.json
          git commit -m "chore: snapshot all current site data from Supabase"
          git push origin HEAD:main
